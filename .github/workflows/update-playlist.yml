name: Update Telugu playlist

on:
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:
  push:
    paths:
      - "kodi/**"
      - "scripts/**"

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build Kodi repository
        run: python scripts/build_kodi_repo.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add zips addons.xml addons.xml.md5 repository.telugulive.zip || true
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update Kodi repository $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
