name: Update Telugu playlist

on:
  schedule:
    - cron: "*/30 * * * *"   # every 30 minutes (GitHub may delay runs by a few minutes)
  workflow_dispatch:          # manual "Run workflow" button
  push:
    paths:
      - "sources.txt"
      - "scripts/**"
      - "kodi/**"

permissions:
  contents: write

concurrency:
  group: update-playlist
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build playlist (fetch, test links, drop dead ones)
        run: python scripts/build_playlist.py

      - name: Build Kodi repository (zips, addons.xml, md5)
        run: python scripts/build_kodi_repo.py

      - name: Commit changes
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add telugu.m3u telugu_all.m3u status.json zips addons.xml addons.xml.md5 repository.telugulive.zip
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update playlist $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
